<div class="min-h-screen bg-gray-50">
  <!-- Dashboard Header -->
  <header class="bg-white shadow-sm border-b">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <!-- User Info -->
        <div class="flex items-center space-x-4">
          <div class="flex-shrink-0 h-10 w-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full flex items-center justify-center text-white font-bold">
            {{ currentUser?.name?.charAt(0) || 'U' }}
          </div>
          <div>
            <h2 class="text-lg font-semibold text-gray-900">{{ currentUser?.name }}</h2>
            <p class="text-sm text-gray-500">{{ getRoleDisplayName() }}</p>
          </div>
        </div>

        <!-- Logout Button -->
        <button
          (click)="logout()"
          class="flex items-center gap-2 px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          Logout
        </button>
      </div>
    </div>
  </header>

  <!-- Dashboard Content Based on Role -->
  <main class="max-w-7xl mx-auto">
    <!-- Super Admin View -->
    <app-super-admin-dashboard 
      *ngIf="userRole === 'super_admin'"
    ></app-super-admin-dashboard>

    <!-- Client Admin View -->
    <app-client-admin-dashboard 
      *ngIf="userRole === 'client_admin'"
    ></app-client-admin-dashboard>

    <!-- Employee View -->
    <app-employee-dashboard 
      *ngIf="userRole === 'employee'"
    ></app-employee-dashboard>

    <!-- Loading State -->
    <div *ngIf="!userRole" class="flex items-center justify-center min-h-screen">
      <div class="text-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
        <p class="text-gray-600">Loading dashboard...</p>
      </div>
    </div>
  </main>
</div>
